name: GitHub Pages, APT & Arch Repo

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-arch:
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Pacman paketlerini kur
        run: |
          pacman -Syu --noconfirm --needed base-devel jq curl

      - name: Arch pacman deposu oluştur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public-arch
          REL_JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=5")"
          DEB_URL="$(printf '%s' "$REL_JSON" | jq -r '[.[].assets[] | select(.name | endswith("_amd64.deb"))][0].browser_download_url // empty')"
          TAG="$(printf '%s' "$REL_JSON" | jq -r '[.[] | select(.assets | any(.name | endswith("_amd64.deb")))][0].tag_name // empty')"

          if [ -n "$DEB_URL" ] && [ -n "$TAG" ]; then
            VER="${TAG#v}"
            VER="${VER//-/_}"
            mkdir -p /tmp/archbuild
            cp packaging/arch/PKGBUILD /tmp/archbuild/PKGBUILD
            curl -fL "$DEB_URL" -o /tmp/archbuild/pkg.deb
            SHA="$(sha256sum /tmp/archbuild/pkg.deb | awk '{print $1}')"
            sed -i "s|^pkgver=.*|pkgver=${VER}|" /tmp/archbuild/PKGBUILD
            sed -i "s|^source=.*|source=(\"${DEB_URL}\")|" /tmp/archbuild/PKGBUILD
            sed -i "s|^sha256sums=.*|sha256sums=('${SHA}')|" /tmp/archbuild/PKGBUILD

            useradd -m builder || true
            chown -R builder:builder /tmp/archbuild
            su - builder -c "cd /tmp/archbuild && makepkg -d --noconfirm"
            cp /tmp/archbuild/*.pkg.tar.* public-arch/
            cd public-arch
            repo-add ydevdesk.db.tar.gz *.pkg.tar.*
            cat > index.html <<'EOF'
<!doctype html><meta charset="utf-8"><title>YDevDesk Arch Repo</title>
<pre>
[ydevdesk]
SigLevel = Optional TrustAll
Server = https://yagyz.github.io/YDevDesk/arch
</pre>
EOF
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: arch-repo
          path: public-arch

  build-pages:
    needs: build-arch
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: arch-repo
          path: public/arch

      - name: APT araçlarını kur
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils jq

      - name: GitHub Pages & APT deposu içeriğini hazırla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public/apt
          cp docs/site/index.html public/index.html
          cp docs/screenshots/workspace.png public/workspace.png
          cp src-tauri/icons/128x128@2x.png public/logo.png

          DEB_URL="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=5" \
            | jq -r '[.[].assets[] | select(.name | endswith("_amd64.deb"))][0].browser_download_url // empty')"

          if [ -n "$DEB_URL" ]; then
            echo "İndirilen .deb: $DEB_URL"
            curl -fL "$DEB_URL" -o "public/apt/$(basename "$DEB_URL")"
            cd public/apt
            dpkg-scanpackages --multiversion . /dev/null > Packages
            gzip -9c Packages > Packages.gz
            apt-ftparchive release . > Release
            cat > index.html <<'EOF'
<!doctype html><meta charset="utf-8"><title>YDevDesk APT Repo</title>
<pre>
echo 'deb [trusted=yes] https://yagyz.github.io/YDevDesk/apt ./' | sudo tee /etc/apt/sources.list.d/ydevdesk.list
sudo apt update && sudo apt install -y ydevdesk
</pre>
EOF
          else
            echo "Henüz .deb release varlığı bulunamadı; boş APT dizini oluşturuldu."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build-pages
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
